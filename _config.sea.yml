# ============================================================
# Sea 主题配置
# https://harveyzo.github.io/hexo-theme-sea/theme-config/
# ============================================================

# 首页配置
home:
  hero:
    name: # 留空，用 site_title
    intro: # 个人简介
    avatar: # 头像
  posts: recent # recent: 最新文章 | recommend: 推荐文章

# 所有文章
articles:
  path: 'posts'
  per_page: 10
  order_by: -date

# 菜单栏
menu:
  - name: 归档
    url: /archives/
  - name: 标签
    url: /tags/

# 评论
comment:
  enable: false

# 搜索
search:
  enable: false

# 友链
friends:
  # - name: xxx's blog
  #   avatar: https://xx.png
  #   link: https://blog.xxx.com
  #   desc: xxx

# 网站计数
counter:
  enable: false

# Footer
footer:
  builtUpTime: # 2020-05-20 13:14:00

# 社交链接
socialLink:
  - name: GitHub
    link: https://github.com/jianghuifr

# 主题色
primaryColor: '#33ac60'

# 字体 — 系统字体栈，零外部请求
fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif'

# Favicon
favicon: /images/favicon-32x32-next.png
